{{- if .Values.credentials.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.secretName" . }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-root-password: {{ required "credentials.dbRootPassword is required when credentials.create=true" .Values.credentials.dbRootPassword | quote }}
  db-password: {{ required "credentials.dbPassword is required when credentials.create=true" .Values.credentials.dbPassword | quote }}
  wordpress-admin-password: {{ required "credentials.wordpressAdminPassword is required when credentials.create=true" .Values.credentials.wordpressAdminPassword | quote }}
{{- end }}