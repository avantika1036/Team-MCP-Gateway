nameOverride: ''
fullnameOverride: ''

calculator:
  image:
    repository: urumi/calculator-mcp
    tag: '0.1.0'
    pullPolicy: IfNotPresent
  port: 4001
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

utility:
  image:
    repository: urumi/utility-mcp
    tag: '0.1.0'
    pullPolicy: IfNotPresent
  port: 4002
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi

database:
  image:
    repository: postgres
    tag: '17-alpine'
    pullPolicy: IfNotPresent
  existingSecret: urumi-gateway-db
  keys:
    database: postgres-db
    username: postgres-user
    password: postgres-password
    url: database-url
  persistence:
    size: 5Gi
    storageClassName: ''
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi

chat:
  llm:
    baseUrl: 'https://api.groq.com/openai/v1'
    model: 'openai/gpt-oss-120b'
    timeoutMs: 45000
    existingSecret: urumi-llm-credentials
    apiKeyKey: api-key

provisioner:
  image:
    repository: urumi/provisioner
    tag: '0.1.1'
    pullPolicy: IfNotPresent
  port: 4100
  baseDomain: 'urumi.test'
  urlScheme: 'http'
  urlPort: '8080'
  maxStoresPerUser: 3
  namespacePrefix: 'urumi-store-'
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  image:
    repository: urumi/control-plane
    tag: '0.1.11'
    pullPolicy: IfNotPresent
  port: 4000
  adminToken:
    existingSecret: urumi-gateway-admin
    key: admin-token
  upstreamTimeoutMs: 5000
  registry:
    persistence:
      size: 1Gi
      storageClassName: ''
  woocommerce:
    url: 'http://urumi-store-mcp.urumi-store.svc.cluster.local:3002/mcp'
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi

ingress:
  enabled: false
  className: nginx
  host: mcp.urumi.test
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
  tls:
    enabled: false
    secretName: ''
