# Production Gateway ingress profile.
# Replace mcp.example.com and ensure the TLS Secret exists in namespace urumi-platform.
# This file covers the platform Gateway only; see docs/deployment-portability.md for the
# separate TLS requirement for dynamically provisioned storefronts.
ingress:
  enabled: true
  className: nginx
  host: mcp.example.com
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  tls:
    enabled: true
    secretName: urumi-platform-tls
